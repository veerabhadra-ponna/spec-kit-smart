name: Build Python Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g., 1.0.0)"
        required: false
        default: "dev"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: speckitadv
            asset_name: speckitadv-linux-x86_64
          - os: macos-latest
            artifact_name: speckitadv
            asset_name: speckitadv-darwin-x86_64
          - os: macos-14
            artifact_name: speckitadv
            asset_name: speckitadv-darwin-arm64
          - os: windows-latest
            artifact_name: speckitadv.exe
            asset_name: speckitadv-windows-x86_64.exe

    defaults:
      run:
        working-directory: scripts/python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller speckit.spec

      - name: Test executable
        run: |
          ./dist/${{ matrix.artifact_name }} --version
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: scripts/python/dist/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/speckitadv-linux-x86_64/speckitadv
            artifacts/speckitadv-darwin-x86_64/speckitadv
            artifacts/speckitadv-darwin-arm64/speckitadv
            artifacts/speckitadv-windows-x86_64.exe/speckitadv.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
