[project]
name = "speckit"
version = "2.0.0"
description = "Spec Kit Smart - Zero-Prompt Architecture CLI for AI-powered development"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Spec Kit Team"}
]
keywords = ["ai", "cli", "development", "specification", "code-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyinstaller>=6.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
# Primary command name
speckitadv = "speckit.cli:app"
# Aliases for convenience
speckit = "speckit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speckit"]

# Include all assets in the wheel
[tool.hatch.build.targets.wheel.force-include]
"speckit/assets" = "speckit/assets"

# Ensure all asset files are included
[tool.hatch.build]
include = [
    "speckit/**/*.py",
    "speckit/assets/**/*.md",
    "speckit/assets/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
